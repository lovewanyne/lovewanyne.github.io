<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿睡衣18岁生日快乐!!!!</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
}
body{
  min-height:100vh;
  overflow:hidden;
}
/* ========== 第一页：密码开启礼物页【星空背景】 ========== */
#password-page{
  min-height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#fff;
  text-align:center;
  padding:24px;
  background-color:#0b122b;
  background-image:
    radial-gradient(2px 2px at 25px 40px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 90px, #ffffff, transparent),
    radial-gradient(2px 2px at 110px 50px, #cfe0ff, transparent),
    radial-gradient(1px 1px at 160px 100px, #ffffff, transparent),
    radial-gradient(2px 2px at 210px 140px, #b4d1ff, transparent),
    radial-gradient(1px 1px at 270px 60px, #ffffff, transparent),
    radial-gradient(1px 1px at 310px 180px, #d1e5ff, transparent),
    radial-gradient(2px 2px at 80px 200px, #ffffff, transparent),
    radial-gradient(1px 1px at 190px 220px, #bcd, transparent),
    radial-gradient(2px 2px at 260px 260px, #9cf, transparent);
  background-size:350px 350px;
}
/*密码页顶部标题，放在红圈区域*/
.password-header{
  position:absolute;
  top:12%;
  left:0;
  width:100%;
  text-align:center;
  padding:0 24px;
}
.password-header .page-title{
  font-size:26px;
  letter-spacing:2px;
  margin-bottom:8px;
  text-shadow:
    0 0 8px rgba(255,255,255,0.8),
    0 0 22px rgba(170,200,255,0.6);
}
.password-header .page-subtitle{
  font-size:13px;
  letter-spacing:4px;
  color:#bcd3ff;
}
.gift-card{
  width:100%;
  max-width:340px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:24px;
  padding:28px 24px;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,0.35);
}
.gift-icon{
  font-size:48px;
  margin-bottom:16px;
}
.gift-title{
  font-size:20px;
  margin-bottom:8px;
}
.gift-tip{
  font-size:14px;
  color:#bcd3ff;
  margin-bottom:24px;
}
#password-input{
  width:100%;
  padding:14px 18px;
  font-size:16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.12);
  color:#fff;
  outline:none;
  text-align:center;
  margin-bottom:16px;
}
#password-input::placeholder{
  color:rgba(255,255,255,0.5);
}
#open-gift-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#ff6699,#ff3d7f);
  color:#fff;
  font-size:17px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(255,61,127,0.45);
}
#open-gift-btn:active{
  transform:scale(0.97);
}
#err-tip{
  display:none;
  margin-top:14px;
  font-size:13px;
  color:#ff9999;
}
/* ========== 第二页：空白星空祝福页 +淡入动画 ========== */
#starry-page{
  display:none;
  min-height:100vh;
  width:100%;
  position:relative;
  color:#fff;
  text-align:center;
  padding:24px;
  background-color:#0b122b;
  background-image:
    radial-gradient(2px 2px at 25px 40px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 90px, #ffffff, transparent),
    radial-gradient(2px 2px at 110px 50px, #cfe0ff, transparent),
    radial-gradient(1px 1px at 160px 100px, #ffffff, transparent),
    radial-gradient(2px 2px at 210px 140px, #b4d1ff, transparent),
    radial-gradient(1px 1px at 270px 60px, #ffffff, transparent),
    radial-gradient(1px 1px at 310px 180px, #d1e5ff, transparent),
    radial-gradient(2px 2px at 80px 200px, #ffffff, transparent),
    radial-gradient(1px 1px at 190px 220px, #bcd, transparent),
    radial-gradient(2px 2px at 260px 260px, #9cf, transparent);
  background-size:350px 350px;
  opacity:0;
  transition:opacity 1s ease-in-out;
}
#starry-page.show{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:1;
}
/* 隐藏音乐按钮 */
audio{
  display:none;
}
</style>
</head>
<body>
<!-- 第一页：输入密码开启礼物 -->
<div id="password-page">
  <!--红圈位置 生日标题-->
  <div class="password-header">
    <h1 class="page-title">18岁生日快乐!!!!</h1>
    <p class="page-subtitle">HAPPY BIRTHDAY</p>
  </div>

  <div class="gift-card">
    <div class="gift-icon">🎁</div>
    <div class="gift-title">输入密码开启礼物</div>
    <div class="gift-tip">只有你能打开这份惊喜</div>
    <input id="password-input" type="password" placeholder="请输入密码">
    <button id="open-gift-btn">开启礼物</button>
    <p id="err-tip">密码错误，请重新输入</p>
  </div>
</div>

<!-- 第二页：空白星空页（无文字） -->
<div id="starry-page">
  <audio id="bgMusic" preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  
</div>

<script>
const passwordInput = document.getElementById("password-input");
const openGiftBtn = document.getElementById("open-gift-btn");
const errTip = document.getElementById("err-tip");
const passwordPage = document.getElementById("password-page");
const starryPage = document.getElementById("starry-page");
const bgMusic = document.getElementById("bgMusic");
// 密码固定717
const correctPwd = "717";
function openGift(){
  const val = passwordInput.value.trim();
  if(val === correctPwd){
    // 密码正确，星空淡入
    passwordPage.style.display = "none";
    starryPage.classList.add("show");
    // 尝试播放音乐，Safari需要点击触发
    bgMusic.currentTime = 0;
    bgMusic.play().catch(() => {
      starryPage.addEventListener("click", () => {
        bgMusic.play();
      }, { once: true });
    });
  }else{
    // 密码错误：提示清空
    errTip.style.display = "block";
    passwordInput.value = "";
    passwordInput.focus();
  }
}
openGiftBtn.onclick = openGift;
passwordInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    openGift();
  }
});
</script>
</body>
</html>
