<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18岁生日快乐!!!!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
  min-height:100vh;
  background:#1a1025;
  background-image:url('bg.jpg');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#fff;
}
/* 全局蒙版，压暗背景，文字更清晰 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.75) 100%);
  z-index:1;
}

#password-box{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:24px;
  /* 呼吸动画，Safari兼容 */
  animation: breathe 4s ease-in-out infinite alternate;
}
@keyframes breathe {
  0%{transform: scale(1);}
  100%{transform: scale(1.025);}
}

#password-box .tip-main{
  font-size:1.3rem;
  text-align:center;
  letter-spacing:1px;
}
#password-box .tip-sub{
  font-size:0.95rem;
  opacity:0.65;
  letter-spacing:2px;
  margin-bottom:8px;
}

#content{
  display:none;
  position:relative;
  z-index:2;
  padding:40px 20px;
  max-width:700px;
  margin:0 auto;
}
h1{
  font-size:2.4rem;
  margin-bottom:24px;
  color:#ffd6e0;
  text-align:center;
}
p{
  font-size:1.1rem;
  line-height:1.8;
  margin-bottom:16px;
}

/* 磨砂输入框，适配Safari */
input{
  padding:14px 18px;
  font-size:20px;
  border-radius:14px;
  border: 1px solid rgba(255,255,255,0.18);
  outline:none;
  width:240px;
  background:rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color:#fff;
  text-align:center;
}
input::placeholder{
  color:rgba(255,255,255,0.5);
}

button{
  padding:14px 36px;
  font-size:18px;
  border:none;
  border-radius:14px;
  background: linear-gradient(135deg,#ff88aa,#ff6699);
  color:white;
  cursor:pointer;
  transition: all 0.22s ease;
}
button:active{
  transform: scale(0.96);
}
button:hover{
  opacity:0.92;
}
</style>
</head>
<body>
<div id="password-box">
  <div class="tip-main">有些心里话，想只讲给你听</div>
  <div class="tip-sub">Forever love for Wayne</div>
  <input type="password" id="pwd" placeholder="输入密码" inputmode="numeric">
  <button onclick="checkPwd()">开启礼物</button>
</div>
<div id="content">
  <h1>🎂 生日快乐，宝贝</h1>
  <p>时间过得好快，又陪你度过一年。</p>
  <p>很多话当面不好说，写在这里送给你。</p>
  <p>愿你永远开心，平安顺遂，想要的都慢慢实现。</p>
  <p>往后的日子，我会一直在你身边。</p>
  <p>——你亲爱的搓澡巾</p>
</div>
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">

<script>
// 密码
const PASS = "717";
const audio = document.getElementById('bgm');

function checkPwd(){
  let val = document.getElementById('pwd').value;
  if(val === PASS){
    document.getElementById('password-box').style.display="none";
    document.getElementById('content').style.display="block";
    // 在按钮点击手势内播放音频，兼容iPhone Safari
    audio.play().catch(err=>{
      console.log("音频播放异常：",err);
    });
  }else{
    alert("密码不对，再试试~");
    //输错密码清空输入框
    document.getElementById('pwd').value = "";
  }
}
// 回车键盘直接提交（苹果手机键盘return键）
document.getElementById('pwd').addEventListener('keydown',function(e){
  if(e.key === 'Enter') checkPwd();
})
</script>
</body>
</html>
