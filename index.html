<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18岁生日快乐!!!!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
/* 封面页：你的情侣合照背景（P1界面） */
#card-page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#1a1025;
  background-image:url('bg.jpg');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#fff;
  padding:20px;
}
#card-page h2{
  font-size:26px;
  margin-bottom:12px;
  font-weight:500;
}
#card-page p{
  font-size:16px;
  letter-spacing:1px;
  margin-bottom:40px;
  opacity:0.9;
}
#card-btn{
  padding:16px 60px;
  border:none;
  border-radius:999px;
  background:#ff6699;
  color:white;
  font-size:20px;
}

/* 密码输入页面 独立背景 */
#password-box{
  display:none;
  min-height:100vh;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg, #191638, #22204b);
  color:#fff;
  padding:20px;
}
#password-box h2{
  font-size:28px;
  margin-bottom:14px;
}
#password-box .tip-text{
  font-size:16px;
  margin-bottom:32px;
  opacity:0.85;
}
#password-input{
  width:85%;
  max-width:340px;
  padding:16px 20px;
  font-size:18px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1);
  color:#fff;
  outline:none;
  margin-bottom:24px;
}
#submit-btn{
  padding:16px 60px;
  border:none;
  border-radius:999px;
  background:#ff6699;
  color:white;
  font-size:20px;
}
#err-tip{
  display:none;
  margin-top:20px;
  color:#ff9999;
}

/* ✅ 密码成功后【像素星空页面，P2同款效果】 */
#main-page{
  display:none;
  min-height:100vh;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  /* CSS生成像素星空，不用图片 */
  background-color:#0b122b;
  background-image:
    radial-gradient(2px 2px at 25px 40px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 90px, #ffffff, transparent),
    radial-gradient(2px 2px at 110px 50px, #cfe0ff, transparent),
    radial-gradient(1px 1px at 160px 100px, #ffffff, transparent),
    radial-gradient(2px 2px at 210px 140px, #b4d1ff, transparent),
    radial-gradient(1px 1px at 270px 60px, #ffffff, transparent),
    radial-gradient(1px 1px at 310px 180px, #d1e5ff, transparent);
  background-size:350px 350px;
  color:#fff;
  text-align:center;
}
.birthday-title {
  font-size:34px;
  letter-spacing:2px;
  color:#fff;
  /* 文字发光效果，和P2一致 */
  text-shadow:
    0 0 8px rgba(255, 255, 255, 0.8),
    0 0 22px rgba(170, 200, 255, 0.6);
  margin-bottom:12px;
}
.birthday-subtitle{
  font-size:16px;
  letter-spacing:4px;
  color:#bcd3ff;
  margin-bottom:40px;
}
#audioBtn{
  padding:14px 40px;
  border:none;
  border-radius:999px;
  background:rgba(255,255,255,0.15);
  color:#fff;
  font-size:17px;
  border:1px solid rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<!-- 1.封面页（合照背景，P1） -->
<div id="card-page">
  <h2>有些心里话，想只讲给你听</h2>
  <p>Forever love for Wayne</p>
  <button id="card-btn">开启礼物</button>
</div>

<!-- 2.密码输入页面 -->
<div id="password-box">
  <h2>请输入密码</h2>
  <p class="tip-text">解锁这份专属惊喜</p>
  <input id="password-input" type="password" placeholder="输入密码">
  <button id="submit-btn">确认解锁</button>
  <p id="err-tip">密码错误，请重新输入</p>
</div>

<!--3.密码正确：星空祝福页 P2效果 -->
<div id="main-page">
  <h1 class="birthday-title">穿睡衣生日快乐!!!</h1>
  <p class="birthday-subtitle">HAPPY BIRTHDAY</p>
  <button id="audioBtn">点击播放音乐</button>
  <audio id="bgMusic" preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  
</div>

<script>
const cardPage = document.getElementById("card-page");
const pwdBox = document.getElementById("password-box");
const mainPage = document.getElementById("main-page");
const cardBtn = document.getElementById("card-btn");
const submitBtn = document.getElementById("submit-btn");
const pwdInput = document.getElementById("password-input");
const errTip = document.getElementById("err-tip");
const audioBtn = document.getElementById("audioBtn");
const bgMusic = document.getElementById("bgMusic");

// =========在这里修改你的密码=========
const correctPwd = "717"; 

// 点击开启礼物，跳转到密码页
cardBtn.onclick = () => {
  cardPage.style.display = "none";
  pwdBox.style.display = "flex";
};

// 密码校验函数
function checkPwd(){
  const val = pwdInput.value.trim();
  if(val === correctPwd){
    pwdBox.style.display = "none";
    mainPage.style.display = "flex";
  }else{
    errTip.style.display = "block";
    pwdInput.value = ""; //输错清空输入框
  }
}
submitBtn.onclick = checkPwd;
pwdInput.onkeydown = (e)=>{
  if(e.key === "Enter") checkPwd();
}
//Safari需要手动点击播放音频
audioBtn.onclick = ()=>{
  bgMusic.play();
}
//页面初始化
window.onload = ()=>{
  cardPage.style.display = "flex";
  pwdBox.style.display = "none";
  mainPage.style.display = "none";
}
</script>
</body>
</html>
