<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18岁生日快乐!!!!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{
  min-height:100vh;
  background:#1a1025;
  background-image:url('bg.jpg');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  color:#fff;
}
#password-box{
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
}
#content{
  display:none;
  padding:40px 20px;
  max-width:700px;
  margin:0 auto;
}
h1{
  font-size:2.4rem;
  margin-bottom:24px;
  color:#ffd6e0;
  text-align:center;
}
p{
  font-size:1.1rem;
  line-height:1.8;
  margin-bottom:16px;
}
input{
  padding:12px 16px;
  font-size:18px;
  border-radius:8px;
  border:none;
  outline:none;
}
button{
  padding:12px 24px;
  font-size:18px;
  border:none;
  border-radius:8px;
  background:#ff88aa;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>
<div id="password-box">
  <p>请输入密码解锁这份礼物</p>
  <input type="password" id="pwd" placeholder="输入密码">
  <button onclick="checkPwd()">打开</button>
</div>
<div id="content">
  <h1>🎂 生日快乐，宝贝</h1>
  <p>时间过得好快，又陪你度过一年。</p>
  <p>很多话当面不好说，写在这里送给你。</p>
  <p>愿你永远开心，平安顺遂，想要的都慢慢实现。</p>
  <p>往后的日子，我会一直在你身边。</p>
  <p>——你亲爱的搓澡巾</p>
</div>
<audio id="bgm" loop>
  <source src="bgm.mp3" type="audio/mpeg">

<script>
// 密码
const PASS = "717";
const audio = document.getElementById('bgm');

function checkPwd(){
  let val = document.getElementById('pwd').value;
  if(val === PASS){
    document.getElementById('password-box').style.display="none";
    document.getElementById('content').style.display="block";
    // 在按钮点击手势内播放音频，兼容iPhone Safari
    audio.play().catch(err=>{
      console.log("音频播放异常：",err);
    });
  }else{
    alert("密码不对，再试试~");
    //输错密码清空输入框
    document.getElementById('pwd').value = "";
  }
}
</script>
</body>
</html>
