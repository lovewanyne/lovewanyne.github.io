<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>18岁生日快乐!!!!</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
body{
  min-height:100vh;
  overflow:hidden;
}

/* 公共星空背景 */
.star-bg{
  background-color:#0b1022;
  background-image:
    radial-gradient(2px 2px at 25px 40px, #ffffff, transparent),
    radial-gradient(1px 1px at 60px 90px, #ffffff, transparent),
    radial-gradient(2px 2px at 110px 50px, #cfe0ff, transparent),
    radial-gradient(1px 1px at 160px 100px, #ffffff, transparent),
    radial-gradient(2px 2px at 210px 140px, #b4c8ff, transparent),
    radial-gradient(1px 1px at 270px 60px, #ffffff, transparent),
    radial-gradient(1px 1px at 310px 180px, #d1ddff, transparent),
    radial-gradient(2px 2px at 80px 200px, #ffffff, transparent),
    radial-gradient(1px 1px at 190px 220px, #bcd, transparent),
    radial-gradient(2px 2px at 260px 260px, #9cf, transparent);
  background-size:350px 350px;
}

/* 动画定义 */
@keyframes twinkle {
  0% { opacity:0.2; }
  50% { opacity:1; }
  100% { opacity:0.2; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

/* 烟花画布 */
#fireworks-canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:3;
}

/* 底层星空页面 */
#starry-page{
  position:fixed;
  inset:0;
  color:#fff;
  text-align:center;
  padding:24px;
  opacity:1;
  pointer-events:none;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
}
#starry-page.show{
  pointer-events:auto;
}

/* 上层密码页面：整块慢慢消失 */
#password-page{
  min-height:100vh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:#fff;
  text-align:center;
  padding:24px;
  position:absolute;
  inset:0;
  opacity:1;
  transition: opacity 1s ease-out;
  z-index:2;
}
#password-page.fade-out{
  opacity:0;
  pointer-events:none;
}

.password-header{
  position:absolute;
  top:12%;
  left:0;
  width:100%;
  text-align:center;
  padding:0 24px;
}
.password-header .page-title{
  font-size:42px;
  letter-spacing:2px;
  margin-bottom:8px;
  text-shadow:
    0 0 8px rgba(255,255,255,0.8),
    0 0 22px rgba(170,190,255,0.6);
}
.password-header .page-subtitle{
  font-size:16px;
  letter-spacing:4px;
  color:#bcd3ff;
}

.gift-card{
  width:100%;
  max-width:340px;
  background:rgba(40,45,70,0.45);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:24px;
  padding:32px 28px;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 40px rgba(0,0,0,0.35);
  transition: transform 0.2s;
}
.gift-card.shake{
  animation: shake 0.4s ease;
}
.gift-icon{
  font-size:60px;
  margin-bottom:16px;
}
.gift-title{
  font-size:26px;
  margin-bottom:8px;
}
.gift-tip{
  font-size:16px;
  color:#bcd3ff;
  margin-bottom:28px;
}

#password-input{
  width:100%;
  padding:16px 18px;
  font-size:18px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.25);
  background:rgba(255,255,255,0.08);
  color:#fff;
  outline:none;
  text-align:center;
  margin-bottom:20px;
  -webkit-user-select: text !important;
  user-select: text !important;
}
#password-input::placeholder{
  color:rgba(255,255,255,0.45);
}

#open-gift-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#ff66aa,#ff3d7f);
  color:#fff;
  font-size:20px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 0 24px rgba(255,61,127,0.45);
  transition: all 0.18s ease;
}
#open-gift-btn:active{
  transform:scale(0.96) translateY(2px);
  box-shadow:0 4px 12px rgba(255,61,127,0.3);
  background:linear-gradient(135deg,#ff5588,#ff2b6f);
}
.btn-press{
  transform:scale(0.96) translateY(2px) !important;
  box-shadow:0 4px 12px rgba(255,61,127,0.3) !important;
  background:linear-gradient(135deg,#ff5588,#ff2b6f) !important;
}

#err-tip{
  display:none;
  margin-top:16px;
  font-size:15px;
  color:#ff8888;
}

/* 星星闪烁层 */
.star-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  animation: twinkle 7s ease-in-out infinite;
}
audio{
  display:none;
}
</style>
</head>
<body>

<!-- 烟花画布 -->
<canvas id="fireworks-canvas"></canvas>

<!-- 全局闪烁星星层 -->
<div class="star-layer">
  <div class="star" style="width:2px;height:2px;top:8%;left:12%;animation-delay:0s"></div>
  <div class="star" style="width:1px;height:1px;top:17%;left:85%;animation-delay:1.2s"></div>
  <div class="star" style="width:2px;height:2px;top:32%;left:7%;animation-delay:2.1s"></div>
  <div class="star" style="width:1px;height:1px;top:44%;left:92%;animation-delay:0.7s"></div>
  <div class="star" style="width:2px;height:2px;top:58%;left:16%;animation-delay:3.3s"></div>
  <div class="star" style="width:1px;height:1px;top:66%;left:80%;animation-delay:1.8s"></div>
  <div class="star" style="width:2px;height:2px;top:79%;left:6%;animation-delay:4.2s"></div>
  <div class="star" style="width:1px;height:1px;top:86%;left:88%;animation-delay:2.6s"></div>
  <div class="star" style="width:1px;height:1px;top:24%;left:45%;animation-delay:5.1s"></div>
  <div class="star" style="width:2px;height:2px;top:72%;left:52%;animation-delay:0.4s"></div>
</div>

<!-- 底层星空页面 -->
<div id="starry-page" class="star-bg">
  <audio id="bgMusic" preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
</div>

<!-- 上层密码页面 -->
<div id="password-page" class="star-bg">
  <div class="password-header">
    <h1 class="page-title">18岁生日快乐!!!!</h1>
    <p class="page-subtitle">HAPPY BIRTHDAY</p>
  </div>
  <div class="gift-card">
    <div class="gift-icon">🎁</div>
    <h2 class="gift-title">输入密码开启礼物</h2>
    <p class="gift-tip">只有你能打开这份惊喜</p>
    <input id="password-input" type="password" placeholder="请输入密码">
    <button id="open-gift-btn">开启礼物</button>
    <p id="err-tip">密码错误，请重新输入</p>
  </div>
</div>

<script>
// ========== 配置常量 ==========
const CONFIG = {
  correctPassword: "717",
  fadeTime: 1000
};

// ========== DOM缓存 ==========
const el = {
  passwordInput: document.getElementById("password-input"),
  openBtn: document.getElementById("open-gift-btn"),
  errTip: document.getElementById("err-tip"),
  pagePwd: document.getElementById("password-page"),
  pageStarry: document.getElementById("starry-page"),
  giftCard: document.querySelector(".gift-card"),
  bgMusic: document.getElementById("bgMusic"),
  canvas: document.getElementById("fireworks-canvas")
};

// ========== 烟花系统 ==========
const ctx = el.canvas.getContext("2d");
let particles = [];
let fireworks = [];
let canvasWidth, canvasHeight;

function resizeCanvas(){
  canvasWidth = window.innerWidth;
  canvasHeight = window.innerHeight;
  el.canvas.width = canvasWidth;
  el.canvas.height = canvasHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// 随机颜色
function randomColor(){
  const colors = ["#ffd166","#ff9aa2","#b5ead7","#c7ceea","#ffb3ba","#8ef1ff","#ffd6e0"];
  return colors[Math.floor(Math.random() * colors.length)];
}

// 四叶草形状烟花
function createClover(x, y){
  const size = Math.min(canvasWidth, canvasHeight);
  const count = 16;          // 粒子数量，不大
  const spread = size * 0.04; // 炸开范围，小一点
  const color = randomColor();

  // 四叶草四个方向叶片
  const leaves = [
    { angle: 0,   radius: spread },
    { angle: 90,  radius: spread },
    { angle: 180, radius: spread },
    { angle: 270, radius: spread }
  ];

  leaves.forEach(leaf => {
    for(let i = 0; i < 4; i++){
      const offset = (Math.random() - 0.5) * spread * 0.5;
      const a = (leaf.angle + offset * 4) * Math.PI / 180;
      const r = Math.max(10, leaf.radius + offset);

      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * r * 0.06,
        vy: Math.sin(a) * r * 0.06,
        life: 1,
        decay: 0.012 + Math.random() * 0.008,
        size: 2 + Math.random() * 1.2,
        color: color
      });
    }
  });

  // 中心亮点
  for(let i = 0; i < 4; i++){
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 1.2,
      vy: (Math.random() - 0.5) * 1.2,
      life: 1,
      decay: 0.02,
      size: 2.5,
      color: "#ffffff"
    });
  }
}

// 发射烟花
function launchFirework(targetX, targetY){
  const startX = canvasWidth / 2 + (Math.random() - 0.5) * 40;
  const startY = canvasHeight;

  fireworks.push({
    x: startX,
    y: startY,
    targetX: targetX,
    targetY: targetY,
    speed: 4 + Math.random() * 0.6,
    trail: []
  });
}

// 更新烟花
function updateFireworks(){
  ctx.clearRect(0, 0, canvasWidth, canvasHeight);

  // 画拖尾
  for(let i = fireworks.length - 1; i >= 0; i--){
    const f = fireworks[i];
    const dx = f.targetX - f.x;
    const dy = f.targetY - f.y;
    const dist = Math.hypot(dx, dy);

    f.trail.push({ x: f.x, y: f.y });
    if(f.trail.length > 10) f.trail.shift();

    f.x += dx * 0.045;
    f.y += dy * 0.045;

    // 画飞行轨迹
    for(let t = 0; t < f.trail.length; t++){
      const p = f.trail[t];
      const alpha = t / f.trail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.4 * alpha, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 230, 150, ${alpha})`;
      ctx.fill();
    }

    // 到达目标点，炸开四叶草
    if(dist < 6){
      createClover(f.targetX, f.targetY);
      fireworks.splice(i, 1);
    }
  }

  // 更新粒子
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.004;
    p.vx *= 0.986;
    p.vy *= 0.986;
    p.life -= p.decay;

    if(p.life <= 0){
      particles.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(updateFireworks);
}
updateFireworks();

// 点击空白区域发射烟花
function handleStarryClick(e){
  // 如果密码页还没消失，不触发烟花
  if(!el.pageStarry.classList.contains("show")) return;

  // 点击位置
  const x = e.clientX || (e.touches && e.touches[0].clientX);
  const y = e.clientY || (e.touches && e.touches[0].clientY);

  if(x === undefined || y === undefined) return;

  // 点击密码区域不触发，避免误触
  if(el.pagePwd && !el.pagePwd.classList.contains("fade-out")){
    const rect = el.pagePwd.getBoundingClientRect();
    if(x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) return;
  }

  launchFirework(x, y);
}

el.pageStarry.addEventListener("click", handleStarryClick);
el.pageStarry.addEventListener("touchstart", (e)=>{
  if(e.touches && e.touches.length > 0){
    handleStarryClick(e.touches[0]);
  }
}, { passive: true });

// ========== 密码逻辑 ==========
function handlePasswordSuccess(){
  el.pagePwd.classList.add("fade-out");
  el.pageStarry.classList.add("show");

  el.bgMusic.currentTime = 0;
  el.bgMusic.play().catch(()=>{
    el.pageStarry.addEventListener("click", ()=>{
      el.bgMusic.play();
    }, { once:true });
  });
}

function handlePasswordFail(){
  el.errTip.style.display = "block";
  el.giftCard.classList.add("shake");
  el.passwordInput.value = "";
  el.passwordInput.focus();
  setTimeout(()=> el.giftCard.classList.remove("shake"),400);
}

function checkPassword(){
  const inputVal = el.passwordInput.value.trim();
  if(inputVal === CONFIG.correctPassword){
    handlePasswordSuccess();
  }else{
    handlePasswordFail();
  }
}

function bindTouchEffect(){
  el.openBtn.addEventListener('touchstart', ()=> el.openBtn.classList.add('btn-press'));
  el.openBtn.addEventListener('touchend', ()=> el.openBtn.classList.remove('btn-press'));
  el.openBtn.addEventListener('touchcancel', ()=> el.openBtn.classList.remove('btn-press'));
}

function bindEvents(){
  el.openBtn.onclick = checkPassword;
  el.passwordInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") checkPassword();
  });
  bindTouchEffect();
}

bindEvents();
</script>
</body>
</html>
